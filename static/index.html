<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise Voice AI</title>
<style>
body{font-family:Arial;background:#08111f;color:#eaf2ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}
.card{background:#101d30;border:1px solid #243b57;border-radius:16px;padding:20px;margin-bottom:18px}
button{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#67e8f9}.danger{background:#fb7185}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}pre{white-space:pre-wrap;line-height:1.5;color:#c8d6e8}
@media(max-width:800px){.grid{grid-template-columns:1fr}}.muted{color:#8fa3bd}
</style></head><body><div class="wrap">
<div class="card"><h1>Enterprise Voice AI & OmniAgent</h1><p class="muted">VAD → ASR → LangGraph → RAG → TTS</p>
<button id="start" class="primary">Start recording</button> <button id="stop" class="danger" disabled>Stop</button>
<p id="status">Ready</p></div>
<div class="grid"><div class="card"><h2>Conversation</h2><h3>Transcript</h3><pre id="tx">—</pre><h3>Response</h3><pre id="res">—</pre></div>
<div class="card"><h2>Latency</h2><pre id="lat">—</pre><h2>Voice state</h2><pre id="state">—</pre></div></div>
<div class="card"><h2>Knowledge Base</h2><input id="file" type="file" accept=".txt,.md,.pdf"> <button id="upload" class="primary">Upload & index</button><pre id="up">—</pre></div>
</div>
<script>
let rec,chunks=[],stream;
const $=id=>document.getElementById(id);
$("start").onclick=async()=>{
stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];
rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=send;rec.start();
$("start").disabled=true;$("stop").disabled=false;$("status").textContent="Listening...";
};
$("stop").onclick=()=>{rec.stop();stream.getTracks().forEach(t=>t.stop());$("start").disabled=false;$("stop").disabled=true;$("status").textContent="Processing..."};
async function send(){
let fd=new FormData();fd.append("audio",new Blob(chunks,{type:rec.mimeType}),"turn.webm");
let r=await fetch("/api/voice/turn",{method:"POST",body:fd});let d=await r.json();
if(!r.ok){alert(d.detail);$("status").textContent="Error";return}
$("tx").textContent=d.transcript||"—";$("res").textContent=d.response||"—";
$("lat").textContent=JSON.stringify(d.latency_ms,null,2);$("state").textContent=JSON.stringify(d.voice_state,null,2);
$("status").textContent="Completed";speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(d.response));
}
$("upload").onclick=async()=>{let f=$("file").files[0];if(!f)return alert("Choose a file");
let fd=new FormData();fd.append("file",f);let r=await fetch("/api/knowledge/upload",{method:"POST",body:fd});$("up").textContent=JSON.stringify(await r.json(),null,2)};
</script></body></html>
