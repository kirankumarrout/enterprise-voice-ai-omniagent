[build]
  command = "mkdir -p dist && cp -R static/. dist/"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/api/*"
  to = "https://enterprise-voice-ai-omniagent.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://enterprise-voice-ai-omniagent.onrender.com/health"
  status = 200
  force = true
