services:
  - type: web
    name: enterprise-voice-ai-omniagent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: VAD_THRESHOLD
        value: "0.50"
      - key: MIN_SPEECH_MS
        value: "250"
      - key: ENDPOINT_SILENCE_MS
        value: "700"
      - key: BARGE_IN_ENABLED
        value: "true"
      - key: DATA_DIR
        value: data
      - key: FRONTEND_URL
        value: "*"
